# FIXTURE: defaults designed to work, which is what makes them dangerous.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: recipes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recipes-dev-password}
    volumes:
      - db-data:/var/lib/postgresql/data
  minio:
    image: quay.io/minio/minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
  createbuckets:
    image: quay.io/minio/mc
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 admin admin;
      mc mb -p local/recipes;
      mc anonymous set download local/recipes"
volumes:
  db-data:
